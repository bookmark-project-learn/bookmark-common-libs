name: ci-pipeline
on:
  pull_request:
    branches:
      - "main"
  push:
    branches:
      - "main"
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
jobs:
  ci_pipeline: # name of first job
    runs-on: ubuntu-latest # runner
    steps:
      # Checkout the repository
      - name: Check out repository code #
        uses: actions/checkout@v6

      # Setup Go
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.26.4"
      # Run test
      - name: Run test
        run: make test

      # Deploy module to proxy.golang.org
      - name: Deploy module to proxy.golang.org
        if: ${{ success() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        run: make deploy-module